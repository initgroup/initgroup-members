<section class="page" id="page-admin-notices" aria-labelledby="adminNoticesTitle">
    <header class="page-header">
        <div>
            <h2 id="adminNoticesTitle">공지사항 관리</h2>
            <p>홈에 게시할 공지사항을 작성하고 게시 상태를 관리합니다.</p>
        </div>
    </header>

    <div class="list-editor-stack">
        <aside class="panel" aria-labelledby="noticeListTitle">
            <div class="panel-header">
                <div>
                    <h3 id="noticeListTitle">공지 목록</h3>
                    <p>항목을 선택하면 오른쪽에서 수정할 수 있습니다.</p>
                </div>
            </div>
            <form id="noticeSearchForm" class="toolbar" role="search">
                <label class="field grow">
                    <span>검색어</span>
                    <input id="noticeKeyword" class="input" type="search" maxlength="300" placeholder="제목 또는 내용">
                </label>
                <label class="field">
                    <span>사용 여부</span>
                    <select id="noticeUseFilter" class="select">
                        <option value="">전체</option>
                        <option value="Y">사용</option>
                        <option value="N">중지</option>
                    </select>
                </label>
                <button class="button button-secondary" type="submit">조회</button>
            </form>
            <p id="noticeListStatus" class="inline-status" aria-live="polite"></p>
            <div id="noticeSelectionList" class="selection-list"></div>
        </aside>

        <div class="list-editor-action-bar">
            <button id="newNoticeButton" class="button button-primary" type="button">새 공지</button>
        </div>

        <section class="panel" aria-labelledby="noticeEditorTitle">
            <div class="panel-header">
                <div>
                    <h3 id="noticeEditorTitle">공지 작성</h3>
                    <p id="noticeEditorDescription">새 공지를 작성하고 있습니다.</p>
                </div>
            </div>
            <form id="noticeForm">
                <input id="noticeId" type="hidden">
                <div class="form-grid">
                    <label class="field field-span">
                        <span class="required">제목</span>
                        <input id="noticeTitle" class="input" type="text" maxlength="300" required>
                    </label>
                    <label class="field">
                        <span>유형</span>
                        <select id="noticeType" class="select">
                            <option value="INFO">안내</option>
                            <option value="IMPORTANT">중요</option>
                            <option value="WARNING">주의</option>
                            <option value="MAINTENANCE">점검</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>정렬 순서</span>
                        <input id="noticeSortOrder" class="input" type="number" value="0">
                    </label>
                    <label class="field field-span">
                        <span class="required">내용</span>
                        <textarea id="noticeContent" class="textarea" required></textarea>
                    </label>
                    <label class="field">
                        <span>게시 시작</span>
                        <input id="noticePostStartAt" class="input" type="datetime-local">
                    </label>
                    <label class="field">
                        <span>게시 종료</span>
                        <input id="noticePostEndAt" class="input" type="datetime-local">
                    </label>
                    <label class="field">
                        <span>상단 고정</span>
                        <select id="noticePinYn" class="select">
                            <option value="N">아니요</option>
                            <option value="Y">예</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>사용 여부</span>
                        <select id="noticeUseYn" class="select">
                            <option value="Y">사용</option>
                            <option value="N">중지</option>
                        </select>
                    </label>
                </div>

                <section class="panel panel-subsection" aria-labelledby="noticeAttachmentsTitle">
                    <div class="panel-header">
                        <div>
                            <h3 id="noticeAttachmentsTitle">첨부 파일</h3>
                            <p>새 공지는 먼저 저장한 다음 파일을 추가할 수 있습니다.</p>
                        </div>
                    </div>
                    <div class="toolbar">
                        <label class="field grow">
                            <span>파일 선택</span>
                            <input id="noticeAttachmentFile" class="input" type="file">
                        </label>
                        <label class="field">
                            <span>정렬 순서</span>
                            <input id="noticeAttachmentSortOrder" class="input" type="number" value="0">
                        </label>
                        <button id="uploadNoticeAttachmentButton" class="button button-secondary" type="button">파일 추가</button>
                    </div>
                    <p id="noticeAttachmentStatus" class="inline-status" aria-live="polite"></p>
                    <div id="noticeAttachmentList" class="attachment-list"></div>
                </section>

                <p id="noticeEditorStatus" class="inline-status" aria-live="polite"></p>
                <div class="form-actions">
                    <button id="deleteNoticeButton" class="button button-danger" type="button" hidden>삭제</button>
                    <button class="button button-secondary" type="reset">초기화</button>
                    <button class="button button-primary" type="submit">저장</button>
                </div>
            </form>
        </section>
    </div>
</section>
