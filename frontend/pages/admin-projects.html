<section class="page" id="page-admin-projects" aria-labelledby="adminProjectsTitle">
    <header class="page-header">
        <div>
            <h2 id="adminProjectsTitle">프로젝트 관리</h2>
            <p>연도별 IT 프로젝트의 일정, 금액, 입찰과 참여 현황을 등록하고 관리합니다.</p>
        </div>
    </header>

    <section class="panel" aria-labelledby="projectListTitle">
        <div class="panel-header">
            <div>
                <h3 id="projectListTitle">프로젝트 목록</h3>
                <p>검색 조건은 서버 쿼리에 적용되며, 프로젝트를 선택하면 상세 내용을 확인할 수 있습니다.</p>
            </div>
            <div class="project-search-actions">
                <button id="toggleProjectDetailSearchButton" class="button button-secondary" type="button"
                        aria-expanded="false" aria-controls="projectDetailSearchFields">상세조회</button>
                <button id="resetProjectSearchButton" class="button button-secondary" type="button">조건 초기화</button>
                <button class="button button-primary" type="submit" form="projectSearchForm">조회</button>
            </div>
        </div>

        <form id="projectSearchForm" class="project-search-grid" role="search">
            <div class="project-search-primary">
                <label class="field project-search-keyword">
                    <span>검색어</span>
                    <input id="projectKeyword" class="input" type="search" maxlength="300" placeholder="프로젝트명 또는 발주처">
                </label>
                <label class="field">
                    <span>프로젝트 수행연도 From</span>
                    <input id="projectPeriodYearFromFilter" class="input" type="number" min="1900" max="2100" placeholder="전체">
                </label>
                <label class="field">
                    <span>프로젝트 수행연도 To</span>
                    <input id="projectPeriodYearToFilter" class="input" type="number" min="1900" max="2100" placeholder="전체">
                </label>
                <label class="field">
                    <span>진행상태</span>
                    <select id="projectStatusFilter" class="select">
                        <option value="ALL">전체</option>
                        <option value="PLANNED">계획</option>
                        <option value="BIDDING">입찰</option>
                        <option value="CONTRACTED">계약</option>
                        <option value="IN_PROGRESS">진행</option>
                        <option value="COMPLETED">완료</option>
                        <option value="CANCELLED">취소</option>
                    </select>
                </label>
            </div>
            <div id="projectDetailSearchFields" class="project-search-detail" hidden>
                <label class="field">
                    <span>참여유형</span>
                    <select id="projectParticipationFilter" class="select">
                        <option value="ALL">전체</option>
                        <option value="LEAD">주관사</option>
                        <option value="CONSORTIUM">컨소사</option>
                        <option value="SUBCONTRACT">하도급</option>
                    </select>
                </label>
                <label class="field">
                    <span>프로젝트 기간 시작</span>
                    <input id="projectPeriodStartFilter" class="input" type="date">
                </label>
                <label class="field">
                    <span>프로젝트 기간 종료</span>
                    <input id="projectPeriodEndFilter" class="input" type="date">
                </label>
                <label class="field">
                    <span>입찰일 시작</span>
                    <input id="projectBidDateFromFilter" class="input" type="date">
                </label>
                <label class="field">
                    <span>입찰일 종료</span>
                    <input id="projectBidDateToFilter" class="input" type="date">
                </label>
                <label class="field">
                    <span>최소 수주금액</span>
                    <input id="projectContractAmountMinFilter" class="input" type="number" min="0" max="999999999999999999" step="1" placeholder="VAT 포함">
                </label>
                <label class="field">
                    <span>최대 수주금액</span>
                    <input id="projectContractAmountMaxFilter" class="input" type="number" min="0" max="999999999999999999" step="1" placeholder="VAT 포함">
                </label>
                <input id="projectPageSize" type="hidden" value="100">
            </div>
        </form>

        <div class="project-list-toolbar">
            <p id="projectListStatus" class="inline-status" aria-live="polite"></p>
            <div class="project-list-controls">
                <label class="field project-sort-field">
                    <span class="sr-only">프로젝트 정렬</span>
                    <select id="projectSortSelect" class="select" aria-label="프로젝트 정렬">
                        <option value="projectStartDate:desc">최근 시작 프로젝트 순</option>
                        <option value="projectStartDate:asc">시작일 오래된순</option>
                        <option value="projectName:asc">프로젝트명 가나다순</option>
                        <option value="customerName:asc">발주처 가나다순</option>
                        <option value="contractAmountVat:desc">수주금액 높은순</option>
                    </select>
                </label>
                <div class="project-view-toggle" role="group" aria-label="프로젝트 보기 방식">
                    <button class="project-view-button" type="button" data-project-view="panel"
                            aria-pressed="false" title="패널형 보기">
                        <span aria-hidden="true">▦</span><span class="sr-only">패널형 보기</span>
                    </button>
                    <button class="project-view-button is-active" type="button" data-project-view="list"
                            aria-pressed="true" title="목록형 보기">
                        <span aria-hidden="true">☷</span><span class="sr-only">목록형 보기</span>
                    </button>
                </div>
            </div>
        </div>
        <div id="projectCollection" class="project-collection is-list-view">
            <div id="projectTableBody" class="project-items" role="listbox" aria-label="프로젝트 목록"></div>
        </div>
        <nav id="projectPagination" class="grid-pagination" aria-label="프로젝트 목록 페이지"></nav>
    </section>

    <div class="list-editor-action-bar">
        <button id="newProjectButton" class="button button-primary" type="button">새 프로젝트</button>
    </div>

    <section id="projectEditorPanel" class="panel" aria-labelledby="projectEditorTitle">
        <div class="panel-header">
            <div>
                <h3 id="projectEditorTitle">프로젝트 등록</h3>
                <p id="projectEditorDescription">새 프로젝트를 등록하고 있습니다.</p>
            </div>
        </div>
        <form id="projectForm">
            <input id="projectId" type="hidden">
            <div class="form-grid project-form-grid">
                <label class="field">
                    <span class="required">등록연도 (참고)</span>
                    <input id="projectYear" class="input" type="number" min="1900" max="2100" required>
                </label>
                <label class="field">
                    <span class="required">진행상태</span>
                    <select id="projectStatusCode" class="select" required>
                        <option value="PLANNED">계획</option>
                        <option value="BIDDING">입찰</option>
                        <option value="CONTRACTED">계약</option>
                        <option value="IN_PROGRESS">진행</option>
                        <option value="COMPLETED">완료</option>
                        <option value="CANCELLED">취소</option>
                    </select>
                </label>
                <label class="field project-name-field">
                    <span class="required">프로젝트명</span>
                    <input id="projectName" class="input" type="text" maxlength="300" required>
                </label>
                <label class="field">
                    <span class="required">발주처</span>
                    <input id="projectCustomerName" class="input" type="text" maxlength="200" required>
                </label>
                <label class="field">
                    <span class="required">프로젝트 시작일</span>
                    <input id="projectStartDate" class="input" type="date" required>
                </label>
                <label class="field">
                    <span class="required">프로젝트 종료일</span>
                    <input id="projectEndDate" class="input" type="date" required>
                </label>
                <label class="field">
                    <span class="required">발주금액 (VAT 포함)</span>
                    <input id="projectOrderAmountVat" class="input" type="number" min="0" max="999999999999999999" step="1" value="0" required>
                </label>
                <label class="field">
                    <span class="required">수주금액 (VAT 포함)</span>
                    <input id="projectContractAmountVat" class="input" type="number" min="0" max="999999999999999999" step="1" value="0" required>
                </label>
                <label class="field">
                    <span class="required">참여유형</span>
                    <select id="projectParticipationTypeCode" class="select" required>
                        <option value="LEAD">주관사</option>
                        <option value="CONSORTIUM">컨소사</option>
                        <option value="SUBCONTRACT">하도급</option>
                    </select>
                </label>
                <label class="field">
                    <span class="required">참여비중 (%)</span>
                    <input id="projectParticipationRate" class="input" type="number" min="0" max="100" step="0.01" value="100" required>
                </label>
                <label class="field">
                    <span>발주일</span>
                    <input id="projectOrderDate" class="input" type="date">
                </label>
                <label class="field">
                    <span>입찰일</span>
                    <input id="projectBidDate" class="input" type="date">
                </label>
                <label class="field field-span">
                    <span>비고</span>
                    <textarea id="projectDescription" class="textarea" maxlength="2000" placeholder="사업 범위, 특이사항 등"></textarea>
                </label>
            </div>
            <dl id="projectAuditInfo" class="project-audit-info" hidden>
                <div><dt>등록</dt><dd id="projectCreatedAudit">-</dd></div>
                <div><dt>최종 수정</dt><dd id="projectUpdatedAudit">-</dd></div>
            </dl>
            <p id="projectEditorStatus" class="inline-status" aria-live="polite"></p>
            <div class="form-actions">
                <button id="deleteProjectButton" class="button button-danger" type="button" hidden>삭제</button>
                <button id="clearProjectButton" class="button button-secondary" type="button">새로 입력</button>
                <button id="saveProjectButton" class="button button-primary" type="submit">저장</button>
            </div>
        </form>
    </section>

    <section id="projectCompanyEditorPanel" class="panel" aria-labelledby="projectCompanyEditorTitle" hidden>
        <div class="panel-header">
            <div>
                <h3 id="projectCompanyEditorTitle">프로젝트 참여회사</h3>
                <p>프로젝트에 투입할 인력의 소속회사를 먼저 등록합니다. 본사 임직원은 인아이티(본사), 협력업체 인력은 해당 협력업체를 등록해 주세요.</p>
            </div>
        </div>
        <div class="table-wrap grid-five-row-viewport">
            <table class="data-table project-company-management-table">
                <thead><tr><th>회사명</th><th>회사유형</th><th>참여유형</th><th>참여비중</th><th>비고</th></tr></thead>
                <tbody id="adminProjectCompanyTableBody"></tbody>
            </table>
        </div>
        <form id="adminProjectCompanyForm" class="project-company-form">
            <input id="adminProjectCompanyId" type="hidden">
            <label class="field"><span class="required">회사</span><select id="adminProjectCompanyMaster" class="select" required><option value="">회사 선택</option></select></label>
            <label class="field"><span class="required">참여유형</span><select id="adminProjectCompanyType" class="select" required><option value="LEAD">주관사</option><option value="CONSORTIUM">컨소사</option><option value="SUBCONTRACT">하도급</option></select></label>
            <label class="field"><span class="required">참여비중 (%)</span><input id="adminProjectCompanyShareRate" class="input" type="number" min="0" max="100" step="0.01" value="0" required></label>
            <label class="field project-company-note"><span>비고</span><input id="adminProjectCompanyNote" class="input" maxlength="1000"></label>
            <div class="project-company-actions">
                <button id="deleteAdminProjectCompanyButton" class="button button-danger" type="button" hidden>삭제</button>
                <button id="clearAdminProjectCompanyButton" class="button button-secondary" type="button">새로 입력</button>
                <button class="button button-primary" type="submit">참여회사 저장</button>
            </div>
        </form>
        <p id="adminProjectCompanyStatus" class="inline-status" aria-live="polite"></p>
    </section>
</section>
