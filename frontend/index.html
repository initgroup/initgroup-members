<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>INIT Members</title>
    <link rel="stylesheet" href="./css/style.css?v=20260820.10">
    <link rel="icon" href="data:,">
    <script src="./config/app.config.js?v=20260820.10" defer></script>
    <script src="./config/menu.config.js?v=20260820.10" defer></script>
    <script src="./js/common.js?v=20260820.10" defer></script>
    <script src="./js/data-grid.js?v=20260820.10" defer></script>
    <script src="./js/app.js?v=20260820.10" defer></script>
</head>
<body class="app-booting">
    <a class="skip-link" href="#pageHost">본문으로 바로가기</a>

    <div id="appBootScreen" class="app-boot-screen" role="status" aria-live="polite">
        <div class="app-boot-brand">
            <img src="./assets/init-logo.png" alt="iNIT">
            <span class="app-boot-spinner" aria-hidden="true"></span>
            <strong>안전한 접속을 준비하고 있습니다</strong>
            <small>사용자 세션을 확인하는 중입니다.</small>
        </div>
    </div>

    <div class="app-layout">
        <aside id="appSidebar" class="app-sidebar" aria-label="주 메뉴">
            <div class="app-brand">
                <img src="./assets/init-logo.png" alt="" class="app-brand-logo">
                <span id="appBrandName">웹 사이트</span>
                <button id="sidebarClose" class="sidebar-close mobile-only" type="button" aria-label="메뉴 닫기">
                    <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 6l12 12M18 6 6 18"></path>
                    </svg>
                </button>
            </div>

            <nav id="appNavigation" class="app-navigation"></nav>

            <div class="app-sidebar-footer">
                <span id="sidebarUserName">로그인 사용자</span>
                <small id="sidebarUserRole"></small>
            </div>
        </aside>

        <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="메뉴 닫기" hidden></button>

        <section class="app-main">
            <header id="appHeader" class="app-header">
                <div class="app-header-leading">
                    <button id="sidebarToggle" class="icon-button mobile-only" type="button" aria-label="메뉴 열기" aria-controls="appSidebar" aria-expanded="false">
                        <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M5 7h14M5 12h14M5 17h14"></path>
                        </svg>
                    </button>
                    <div>
                        <p id="appHeaderEyebrow" class="app-header-eyebrow">웹 사이트</p>
                        <h1 id="pageTitle">홈</h1>
                    </div>
                </div>
                <div class="app-header-actions">
                    <span id="headerUserName" class="header-user-name"></span>
                    <button id="refreshPageButton" class="button button-quiet" type="button">새로고침</button>
                    <button id="closeCurrentPageButton" class="button button-quiet page-close-button" type="button" title="현재 페이지 닫기" disabled>
                        <svg class="page-close-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="3.5" y="4" width="17" height="16" rx="3"></rect>
                            <path d="M3.5 8.5h17"></path>
                            <path d="m9 12 6 5m0-5-6 5"></path>
                        </svg>
                        <span class="page-close-label">현재 닫기</span>
                    </button>
                    <button id="closeAllPagesButton" class="button button-quiet page-close-button page-close-all-button" type="button" title="전체 페이지 닫기" disabled>
                        <svg class="page-close-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M8 4h9.5A2.5 2.5 0 0 1 20 6.5V16"></path>
                            <rect x="3.5" y="7.5" width="14.5" height="13" rx="2.5"></rect>
                            <path d="M3.5 11.5H18"></path>
                            <path d="m8.5 14 4.5 4m0-4-4.5 4"></path>
                        </svg>
                        <span class="page-close-label">전체 닫기</span>
                    </button>
                    <button id="logoutButton" class="button button-secondary" type="button">로그아웃</button>
                </div>
            </header>

            <main id="pageHost" class="page-host" tabindex="-1" aria-live="polite"></main>
        </section>
    </div>

    <div id="appLoading" class="loading-layer" role="status" aria-live="polite" hidden>
        <div class="loading-card">
            <span class="loading-spinner" aria-hidden="true"></span>
            <div>
                <strong>처리 중입니다</strong>
                <span id="loadingMessage">잠시만 기다려 주세요.</span>
            </div>
        </div>
    </div>

    <dialog id="commonMessageDialog" class="dialog common-message-dialog" aria-labelledby="commonMessageDialogTitle" aria-describedby="commonMessageDialogText">
        <form method="dialog">
            <header class="dialog-header common-message-dialog-header">
                <span id="commonMessageDialogIcon" class="common-message-dialog-icon" aria-hidden="true">?</span>
                <div>
                    <h2 id="commonMessageDialogTitle">확인</h2>
                    <p>요청한 작업을 진행할지 확인해 주세요.</p>
                </div>
            </header>
            <div class="dialog-body">
                <p id="commonMessageDialogText" class="common-message-dialog-text"></p>
            </div>
            <footer class="dialog-footer">
                <button id="commonMessageDialogCancel" class="button button-secondary" type="submit" value="cancel">취소</button>
                <button id="commonMessageDialogConfirm" class="button button-primary" type="submit" value="confirm">확인</button>
            </footer>
        </form>
    </dialog>

    <section id="toastRegion" class="toast-region" aria-label="알림" aria-live="polite" aria-atomic="false"></section>

    <noscript>이 사이트를 사용하려면 JavaScript를 활성화해 주세요.</noscript>
</body>
</html>
